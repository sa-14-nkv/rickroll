<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#111827">
    <title>A quick detour</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #111827;
        color: #f9fafb;
      }

      * { box-sizing: border-box; }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(ellipse at 50% 0%, rgb(124 58 237 / 22%), transparent 55%),
          #111827;
      }

      main {
        width: min(100%, 480px);
        padding: 40px;
        border: 1px solid #374151;
        border-radius: 24px;
        background: rgb(31 41 55 / 88%);
        box-shadow: 0 24px 80px rgb(0 0 0 / 30%);
        text-align: center;
      }

      .mark {
        display: grid;
        width: 56px;
        height: 56px;
        margin: 0 auto 24px;
        place-items: center;
        border-radius: 18px;
        background: #4c1d95;
        font-size: 28px;
      }

      h1 { margin: 0 0 12px; font-size: clamp(1.8rem, 6vw, 2.25rem); }
      p { margin: 0; color: #d1d5db; line-height: 1.6; }

      #status { min-height: 1.5em; margin-top: 16px; color: #d1d5db; font-size: 0.9rem; }
      .privacy { margin-top: 20px; color: #9ca3af; font-size: 0.8rem; }

      @media (max-width: 480px) {
        main { padding: 32px 24px; }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">↗</div>
      <h1>A quick detour</h1>
      <p>Taking you to the next stop…</p>
      <p id="status" role="status" aria-live="polite"></p>
      <p class="privacy">Only an aggregate click total is saved. No personal connection details are stored.</p>
    </main>
    <script>
      const status = document.querySelector("#status");
      const redirectUrl = "https://youtu.be/dQw4w9WgXcQ";

      async function redirect() {
        try {
          const response = await fetch("/api/redirect", {
            method: "POST",
            signal: AbortSignal.timeout(3000)
          });
          const result = await response.json();
          if (!response.ok) {
            throw new Error(result.error || "The click counter is unavailable.");
          }
          window.location.replace(result.redirectUrl);
        } catch (error) {
          status.textContent = `${error.message} Redirecting anyway…`;
          window.setTimeout(() => {
            window.location.replace(redirectUrl);
          }, 1000);
        }
      }

      redirect();
    </script>
  </body>
</html>
