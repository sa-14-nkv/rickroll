<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#111827">
    <title>Una parada rápida</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #111827;
        color: #f9fafb;
      }

      * { box-sizing: border-box; }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(ellipse at 50% 0%, rgb(124 58 237 / 22%), transparent 55%),
          #111827;
      }

      main {
        width: min(100%, 480px);
        padding: 40px;
        border: 1px solid #374151;
        border-radius: 24px;
        background: rgb(31 41 55 / 88%);
        box-shadow: 0 24px 80px rgb(0 0 0 / 30%);
        text-align: center;
      }

      .mark {
        display: grid;
        width: 56px;
        height: 56px;
        margin: 0 auto 24px;
        place-items: center;
        border-radius: 18px;
        background: #4c1d95;
        font-size: 28px;
      }

      h1 { margin: 0 0 12px; font-size: clamp(1.8rem, 6vw, 2.25rem); }
      p { margin: 0; color: #d1d5db; line-height: 1.6; }

      .actions { display: grid; gap: 12px; margin-top: 28px; }
      button {
        width: 100%;
        padding: 14px 20px;
        border: 1px solid #6b7280;
        border-radius: 12px;
        background: transparent;
        color: white;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
      button.primary { border-color: #8b5cf6; background: #8b5cf6; }
      button:hover { filter: brightness(1.12); }
      button:focus-visible { outline: 3px solid #c4b5fd; outline-offset: 3px; }
      button:disabled { cursor: wait; opacity: 0.7; }
      a { color: #c4b5fd; }
      #status { min-height: 1.5em; margin-top: 16px; color: #d1d5db; font-size: 0.9rem; }
      .privacy { margin-top: 20px; color: #9ca3af; font-size: 0.8rem; }

      @media (max-width: 480px) {
        main { padding: 32px 24px; }
      }
    </style>
  </head>
  
  
<body>
  <script>
    (async () => {
      const redirectUrl = "https://youtu.be/1zkqZoVJDxo";

      try {
        const response = await fetch("/api/analytics", {
          method: "POST"
        });

        const result = await response.json();

        if (!response.ok) {
          throw new Error(
            result.error || "No se pudieron guardar las analíticas."
          );
        }

        window.location.replace(result.redirectUrl || redirectUrl);
      } catch (error) {
        console.error("Error en las analíticas:", error);
        window.location.replace(redirectUrl);
      }
    })();
  </script>
</body>

</html>
